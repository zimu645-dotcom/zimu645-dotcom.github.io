<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商短板指标对比大屏</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121a30;
            color: #fff;
            font-family: "Microsoft Yahei", sans-serif;
            padding:20px;
        }
        .header{
            text-align:center;
            margin-bottom:20px;
        }
        .header h1{
            font-size:26px;
            color:#73d8ff;
        }
        .desc{
            color:#a0b4d8;
            margin-top:8px;
        }
        .warn-tip{
            background:#281924;
            border:1px solid #ff5566;
            width:85%;
            margin:12px auto;
            padding:10px;
            border-radius:6px;
            color:#ffb4bc;
        }
        .chart-wrap{
            width:100%;
            height:600px;
        }
    </style>


<style id="hz-nav-css">
.hz-nav{position:fixed;top:0;left:0;right:0;z-index:9999;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:rgba(8,12,22,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(120,160,255,.2);box-shadow:0 4px 24px rgba(0,0,0,.5)}
.hz-nav::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(79,140,247,.5),rgba(124,92,252,.5),transparent)}
.hz-brand{display:flex;align-items:center;gap:8px;color:#eef2fa;font-weight:700;font-size:17px;text-decoration:none;letter-spacing:.5px;flex-shrink:0}
.hz-logo{font-size:19px;filter:drop-shadow(0 0 8px rgba(79,140,247,.6))}
.hz-links{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.hz-links::-webkit-scrollbar{display:none}
.hz-links a{color:#b6c2da;text-decoration:none;font-size:14px;padding:6px 12px;border-radius:8px;white-space:nowrap;transition:all .25s}
.hz-links a:hover{color:#fff;background:rgba(90,140,255,.2)}
.hz-links a.active{color:#fff;background:linear-gradient(135deg,rgba(79,140,247,.3),rgba(124,92,252,.3));box-shadow:inset 0 0 0 1px rgba(120,160,255,.4);font-weight:600}
@media(max-width:760px){.hz-nav{height:50px;padding:0 12px}.hz-brand{font-size:14px}.hz-logo{font-size:16px}.hz-links a{padding:5px 9px;font-size:13px}}
</style>
<style id='hz-adapt'>body{padding-top:76px}</style></head>
<body>
<nav class="hz-nav">
  <a class="hz-brand" href="index.html"><span class="hz-logo">📊</span> 数据看板</a>
  <div class="hz-links">
    <a href="index.html">首页</a>
    <a href="last-month.html">短板指标</a>
    <a href="national-day.html">国庆营销</a>
    <a href="pareto.html">帕累托</a>
    <a href="project-results.html">项目成果</a>
    <a href="malaysia-live.html">马来直播</a>
    <a href="rfm.html">RFM模型</a>
  </div>

    <div class="header">
        <h1>关键指标：当前值 VS 行业参考值</h1>
        <div class="desc">数据源：禅妈妈、京东商智、巨量千川（仅展示京东、抖音、独立站低于行业指标）</div>
        <div class="warn-tip">根据上一个月平台数据，目前抖音、京东和独立站的点击率、转化率和站外进店率均低于行业平均水平，现有的营销方式有很大优化空间。</div>
    </div>
    <div id="mainChart" class="chart-wrap"></div>

<script>
const chartDom = document.getElementById('mainChart');
const myChart = echarts.init(chartDom);
const option = {
    backgroundColor:'#121a30',
    title:{
        show:false
    },
    tooltip: {
        trigger: 'axis',
        formatter:'{b}<br/>{a0}: {c0}%<br/>{a1}: {c1}%'
    },
    legend: {
        data: ['当前数据', '行业参考值'],
        top:10,
        textStyle:{
            color:'#cccccc'
        }
    },
    grid:{
        left:'5%',
        right:'5%',
        top:'12%',
        bottom:'12%'
    },
    xAxis: {
        type: 'category',
        data: ['京东点击率','京东转化率','抖音完播率','抖音转化率','独立站进店率','独立站转化率'],
        axisLabel: {
            color:'#b0c4de',
            fontSize:14
        },
        axisLine:{
            lineStyle:{
                color:'#304166'
            }
        }
    },
    yAxis: {
        name:'百分比(%)',
        nameTextStyle:{
            color:'#b0c4de'
        },
        type: 'value',
        max:25,
        splitLine:{
            lineStyle:{
                color:'#304166'
            }
        },
        axisLabel:{
            color:'#b0c4de',
            fontSize:14
        }
    },
    series: [
        {
            name:'当前数据',
            type:'bar',
            barWidth:'32%',
            data:[
                {value:1.5, label:{show:true,position:'top',color:'#42a5f5',formatter:'1.5%'}},
                {value:1.6, label:{show:true,position:'top',color:'#42a5f5',formatter:'1.6%'}},
                {value:19, label:{show:true,position:'top',color:'#42a5f5',formatter:'19%'}},
                {value:0.38, label:{show:true,position:'top',color:'#42a5f5',formatter:'0.38%'}},
                {value:16, label:{show:true,position:'top',color:'#42a5f5',formatter:'16%'}},
                {value:1.8, label:{show:true,position:'top',color:'#42a5f5',formatter:'1.80%'}}
            ],
            itemStyle:{
                color:'#42a5f5'
            }
        },
        {
            name:'行业参考值',
            type:'bar',
            barWidth:'32%',
            data:[
                {value:2.2, label:{show:true,position:'top',color:'#ffca28',formatter:'2.2%'}},
                {value:2.5, label:{show:true,position:'top',color:'#ffca28',formatter:'2.5%'}},
                {value:25, label:{show:true,position:'top',color:'#ffca28',formatter:'25%'}},
                {value:0.5, label:{show:true,position:'top',color:'#ffca28',formatter:'0.5%'}},
                {value:23, label:{show:true,position:'top',color:'#ffca28',formatter:'23%'}},
                {value:2.2, label:{show:true,position:'top',color:'#ffca28',formatter:'2.20%'}}
            ],
            itemStyle:{
                color:'#ffca28'
            }
        }
    ]
};
myChart.setOption(option);
window.addEventListener('resize',()=>{
    myChart.resize();
})
</script>


<script id="hz-nav-js">!function(){var p=(location.pathname.split('/').pop()||'index.html').toLowerCase();document.querySelectorAll('.hz-links a').forEach(function(a){if((a.getAttribute('href')||'').toLowerCase()===p)a.classList.add('active')})}();</script>
</body>
</html>
