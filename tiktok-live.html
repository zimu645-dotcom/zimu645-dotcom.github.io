<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok 直播数据 · 炫酷大屏</title>
  <style>
    :root {
      --bg: #05070f;
      --panel: rgba(18, 24, 42, 0.55);
      --line: rgba(130, 160, 255, 0.16);
      --text: #eef2ff;
      --muted: #94a3c8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
      padding: 26px 24px 40px;
    }

    /* ===== 动态极光背景 ===== */
    .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; mix-blend-mode: screen; }
    .b1 { width: 520px; height: 520px; background: radial-gradient(circle, #25f4ee, transparent 65%); top: -160px; left: -120px; animation: drift1 16s ease-in-out infinite alternate; }
    .b2 { width: 480px; height: 480px; background: radial-gradient(circle, #fe2c55, transparent 65%); top: 10%; right: -140px; animation: drift2 19s ease-in-out infinite alternate; }
    .b3 { width: 460px; height: 460px; background: radial-gradient(circle, #8b5cf6, transparent 65%); bottom: -160px; left: 30%; animation: drift3 22s ease-in-out infinite alternate; }
    .b4 { width: 420px; height: 420px; background: radial-gradient(circle, #facc15, transparent 65%); top: 55%; left: 55%; animation: drift1 24s ease-in-out infinite alternate-reverse; opacity: .4; }
    @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(90px,70px) scale(1.15); } }
    @keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-110px,50px) scale(1.2); } }
    @keyframes drift3 { from { transform: translate(0,0) scale(1); } to { transform: translate(70px,-90px) scale(1.1); } }
    .grid-overlay { position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(130,160,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(130,160,255,.05) 1px, transparent 1px);
      background-size: 46px 46px; }

    .wrap { position: relative; z-index: 2; max-width: 1460px; margin: 0 auto; }

    /* ===== 头部 ===== */
    header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 26px; }
    .brand { display: flex; align-items: center; gap: 16px; }
    .logo {
      width: 56px; height: 56px; border-radius: 16px; position: relative; display: grid; place-items: center; font-size: 28px;
      background: linear-gradient(135deg, #25f4ee, #fe2c55);
      box-shadow: 0 0 34px rgba(254,44,85,.6), 0 0 60px rgba(37,244,238,.35);
    }
    .logo::after { content:""; position:absolute; inset:-3px; border-radius:19px; border:1px solid rgba(255,255,255,.35); animation: spinGlow 6s linear infinite; }
    @keyframes spinGlow { 0%{ filter:hue-rotate(0);} 100%{ filter:hue-rotate(360deg);} }

    h1 {
      font-size: 30px; letter-spacing: 2px;
      background: linear-gradient(90deg, #25f4ee, #a78bfa, #fe2c55, #facc15);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      background-size: 300% 100%; animation: gradientText 8s linear infinite;
    }
    @keyframes gradientText { 0%{background-position:0 0;} 100%{background-position:300% 0;} }
    .brand .sub { color: var(--muted); font-size: 13px; margin-top: 6px; letter-spacing: 1px; }

    .live {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(20,28,50,.5); border: 1px solid var(--line);
      backdrop-filter: blur(8px);
      padding: 10px 18px; border-radius: 30px; font-size: 13px; color: var(--muted);
      box-shadow: 0 0 20px rgba(37,244,238,.15);
    }
    .live b { color: var(--text); font-weight: 600; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,.7); animation: ping 1.6s infinite; }
    @keyframes ping { 0%{box-shadow:0 0 0 0 rgba(34,197,94,.6);} 70%{box-shadow:0 0 0 10px rgba(34,197,94,0);} 100%{box-shadow:0 0 0 0 rgba(34,197,94,0);} }

    /* ===== 卡片网格 ===== */
    .grid { display: grid; gap: 22px; }
    .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    @media (max-width: 1150px){ .grid.cols-4 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px){ .grid.cols-4 { grid-template-columns: 1fr; } }

    .card {
      position: relative; border-radius: 22px; padding: 22px 18px 8px;
      background: linear-gradient(160deg, rgba(30,40,72,.55), rgba(14,19,36,.65));
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 44px rgba(0,0,0,.5);
      overflow: hidden;
      transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
    }
    .card:hover { transform: translateY(-6px) scale(1.02); border-color: rgba(150,180,255,.4); }

    .card .glowline { position:absolute; top:0; left:0; right:0; height:3px; background: linear-gradient(90deg, transparent, var(--c), transparent); box-shadow: 0 0 16px var(--c); opacity:.9; }

    /* 流光切边 */
    .card::before { content:""; position:absolute; inset:0; border-radius:22px; padding:1px;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.22) 45%, transparent 60%);
      background-size: 250% 250%; animation: sheen 5.5s linear infinite; pointer-events:none;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
    @keyframes sheen { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

    /* 卡片标题 */
    .card-head { display:flex; align-items:center; gap:9px; margin-bottom:6px; }
    .icon { width: 34px; height: 34px; border-radius: 11px; display:grid; place-items:center; font-size:18px; background: rgba(255,255,255,.06); border:1px solid var(--line); box-shadow: inset 0 0 12px rgba(255,255,255,.04); }
    .card-head .name { font-size: 15px; font-weight: 600; letter-spacing: .5px; }
    .card-head .tag { margin-left:auto; font-size: 11px; color: var(--muted); }

    /* 超大数值 */
    .big-num { font-size: 40px; font-weight: 800; line-height:1; letter-spacing: 1px; font-variant-numeric: tabular-nums; margin: 8px 0 4px; text-shadow: 0 0 26px var(--c); }
    .big-num .unit { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 4px; }
    .big-num small { font-size: 18px; }

    /* ===== 环形仪表 ===== */
    .gauge { position: relative; height: 188px; display: grid; place-items: center; }
    .gauge svg { width: 100%; height: 100%; }
    .gauge .cval { position:absolute; top:54%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; }
    .gauge .cval .n { font-size: 22px; font-weight:800; }
    .gauge .cval .l { font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: 1px; }
    .track { fill:none; stroke: rgba(255,255,255,.06); stroke-width: 12; }
    .prog { fill:none; stroke-width: 12; stroke-linecap: round; filter: drop-shadow(0 0 6px var(--c)); transition: stroke .3s; }
    .dashed { fill:none; stroke: rgba(255,255,255,.16); stroke-width: 16; stroke-dasharray: 2 7; transform-origin: 100px 100px; animation: spin 30s linear infinite; }
    .comet { fill:none; stroke: #fff; stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 8px var(--c)); }
    @keyframes spin { to { transform: rotate(360deg); } }

    .label-bar { text-align:center; padding: 6px 0 14px; font-size: 12px; color: var(--muted); letter-spacing: 1px; }
    .label-bar b { color: var(--text); }

    .footer { text-align:center; color:#5c6a8c; font-size:12px; margin-top:30px; letter-spacing:1px; }
  </style>
</head>
<body>
  <div class="aurora">
    <div class="blob b1"></div><div class="blob b2"></div>
    <div class="blob b3"></div><div class="blob b4"></div>
  </div>
  <div class="grid-overlay"></div>

  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">🎥</div>
        <div>
          <h1>TIKTOK · 直播数据大屏</h1>
          <div class="sub">LIVE ROOM METRICS · REAL-TIME</div>
        </div>
      </div>
      <div class="live"><span class="dot"></span> <b>LIVE</b> 数据看板运行中 · 仪表循环动态</div>
    </header>

    <div class="grid cols-4" id="grid"></div>

    <div class="footer">TikTok 直播数据 · 数值静态 / 图表循环动画 / 发光仪表盘</div>
  </div>

  <script>
    // 指标数据（静态数值 + 环形填充比例 value/max）
    const metrics = [
      { icon:'👥', name:'最高在线人数', value:'1,480', unit:'人', max:1500, color:'#fe2c55', tag:'峰值' },
      { icon:'⏱️', name:'人均观看时长', value:'69',   unit:'秒', max:120,  color:'#25f4ee', tag:'时长' },
      { icon:'🛒', name:'商品点击率',   value:'2.0',  unit:'%',  max:5,    color:'#38bdf8', tag:'点击/曝光' },
      { icon:'💬', name:'互动率',       value:'3.6',  unit:'%',  max:10,   color:'#22c55e', tag:'互动/观看' },
      { icon:'👍', name:'点赞率',       value:'4.1',  unit:'%',  max:10,   color:'#f59e0b', tag:'点赞/观看' },
      { icon:'📝', name:'评论率',       value:'0.7',  unit:'%',  max:2,    color:'#a78bfa', tag:'评论/观看' },
      { icon:'💰', name:'直播间转化率', value:'0.35', unit:'%',  max:1,    color:'#e1251b', tag:'成交/进播' },
      { icon:'📈', name:'投流 ROI',     value:'1.12', unit:'',   max:2,    color:'#facc15', tag:'ROI' }
    ];

    const R = 78;
    const C = 2 * Math.PI * R;   // 周长

    // 生成卡片（SVG 环形仪表）
    const gridEl = document.getElementById('grid');
    metrics.forEach((m, i) => {
      const base = m.value0 ? 0 : (parseFloat(m.value.replace(',','')) / m.max);
      const gid = 'g' + i;
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--c', m.color);
      card.innerHTML = `
        <div class="glowline"></div>
        <div class="card-head">
          <div class="icon">${m.icon}</div>
          <div class="name">${m.name}</div>
          <div class="tag">${m.tag}</div>
        </div>
        <div class="big-num">${m.value}<span class="unit">${m.unit}</span></div>
        <div class="gauge">
          <svg viewBox="0 0 200 200">
            <defs>
              <linearGradient id="grad${i}" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="${m.color}" />
                <stop offset="100%" stop-color="#ffffff" stop-opacity=".85" />
              </linearGradient>
            </defs>
            <circle class="track" cx="100" cy="100" r="${R}" />
            <circle class="dashed" cx="100" cy="100" r="${R-11}" />
            <circle class="prog" id="${gid}" cx="100" cy="100" r="${R}"
              stroke="url(#grad${i})"
              stroke-dasharray="${C}"
              stroke-dashoffset="${C}"
              transform="rotate(-90 100 100)" />
            <circle class="comet" id="${gid}c" cx="100" cy="100" r="${R}"
              stroke-dasharray="26 ${C-26}"
              stroke-dashoffset="0"
              transform="rotate(-90 100 100)" />
          </svg>
          <div class="cval">
            <div class="n">${m.value}<span style="font-size:12px">${m.unit}</span></div>
            <div class="l">${m.name}</div>
          </div>
        </div>
        <div class="label-bar">LIVE METRIC <b>· {index}</b></div>
      `;
      gridEl.appendChild(card);
      metrics[i]._base = parseFloat(m.value.replace(',','')) / m.max;
    });

    // 提取可动画的 SVG 圆形
    const gauges = metrics.map((m, i) => ({
      prog: document.getElementById('g'+i),
      comet: document.getElementById('g'+i+'c'),
      base: m._base
    }));

    // ===== 循环动态：进度环呼吸(88%~100%) + 光点沿轨道运行 =====
    const CYCLE = 9000, MIN = 0.88;
    function sway(p){ return MIN + (1-MIN) * (0.5 - 0.5*Math.cos(2*Math.PI*p)); }
    const t0 = performance.now();
    function loop(t){
      const elapsed = t - t0;
      gauges.forEach((g, i) => {
        const progress = ((elapsed + i*600) % CYCLE) / CYCLE;
        const fill = g.base * sway(progress);
        // 进度环：周长 * (1 - fill)
        g.prog.setAttribute('stroke-dashoffset', (C * (1 - fill)).toFixed(2));
        // 光点：持续沿环运行，转速固定、与呼吸节奏无关
        const dot = ((elapsed * 0.05 + i * 40) % C) ;
        g.comet.setAttribute('stroke-dashoffset', (-dot).toFixed(2));
      });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
