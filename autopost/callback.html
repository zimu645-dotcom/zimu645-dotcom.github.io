<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="google" content="notranslate"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在连接 TikTok…</title>
<style>
  body{margin:0;background:#0b0b0f;color:#f4f4f7;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;min-height:100vh}
  .box{text-align:center;max-width:480px;padding:24px}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid #26262f;border-top-color:#fe2c55;margin:0 auto 18px;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .err{color:#ff6b81;font-size:13px;word-break:break-all;text-align:left;background:#15151c;border:1px solid #26262f;border-radius:10px;padding:12px;margin-top:14px}
  a{color:#25f4ee}
  .mut{color:#9a9aab;font-size:13px}
</style>
</head>
<body>
<div class="box">
  <div class="spin" id="spin"></div>
  <h2 id="h">正在完成授权…</h2>
  <p class="mut" id="p">正在用授权码换取访问令牌。</p>
  <div class="err hide" id="err"></div>
  <p style="margin-top:20px"><a href="./" id="back">返回 AutoPost Studio</a></p>
</div>
<script>
const zh = (navigator.language || "").toLowerCase().startsWith("zh");
const TXT = zh
  ? { h: "正在完成授权…", p: "正在用授权码换取访问令牌。", okH: "已连接 ✓", okP: "账号 ID：", failH: "授权失败", failP: "TikTok 返回了错误。", tokenFail: "换取令牌失败", netFail: "连不上后端服务", noCode: "没有拿到授权码", back: "返回 AutoPost Studio" }
  : { h: "Finishing authorization…", p: "Exchanging the authorization code for an access token.", okH: "Connected ✓", okP: "open_id: ", failH: "Authorization failed", failP: "TikTok returned an error.", tokenFail: "Token exchange failed", netFail: "Backend unreachable", noCode: "No authorization code", back: "Back to AutoPost Studio" };
document.documentElement.lang = zh ? "zh-CN" : "en";
document.getElementById("h").textContent = TXT.h;
document.getElementById("p").textContent = TXT.p;
document.getElementById("back").textContent = TXT.back;

const API = location.hostname.endsWith("github.io") ? "https://beyond-tail-publicly-makes.trycloudflare.com" : "";
(async () => {
  const q = new URLSearchParams(location.search);
  const code = q.get("code");
  const err = q.get("error") || q.get("error_type");
  const H = document.getElementById("h"), P = document.getElementById("p"), E = document.getElementById("err");
  if (err) {
    H.textContent = TXT.failH; P.textContent = TXT.failP;
    E.classList.remove("hide"); E.textContent = q.toString();
    document.getElementById("spin").style.display = "none";
    return;
  }
  if (!code) { H.textContent = TXT.noCode; document.getElementById("spin").style.display = "none"; return; }
  const verifier = localStorage.getItem("tt_verifier") || "";
  try {
    const r = await fetch(API + "/api/exchange", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ code, verifier })
    });
    const j = await r.json();
    if (j.ok) {
      H.textContent = TXT.okH;
      P.textContent = TXT.okP + j.open_id;
      setTimeout(() => { location.replace("./"); }, 1200);
    } else {
      H.textContent = TXT.tokenFail;
      document.getElementById("spin").style.display = "none";
      E.classList.remove("hide"); E.textContent = JSON.stringify(j, null, 2);
    }
  } catch (e) {
    H.textContent = TXT.netFail;
    document.getElementById("spin").style.display = "none";
    E.classList.remove("hide"); E.textContent = String(e);
  }
})();
</script>
</body>
</html>
