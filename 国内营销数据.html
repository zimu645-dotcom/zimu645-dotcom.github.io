<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>实时数据大屏 · 国庆营销（单向增长+目标上限）</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js">
    </script>
    <style>
        /* ========== 全局 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            background: #070b17;
            color: #e8edf5;
            min-height: 100vh;
            padding: 18px 24px 30px;
            background-image:
                radial-gradient(ellipse at 10% 20%, rgba(26, 58, 120, 0.35) 0%, transparent 60%),
                radial-gradient(ellipse at 90% 80%, rgba(10, 40, 80, 0.40) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 20, 60, 0.20) 0%, transparent 70%);
            background-attachment: fixed;
            animation: bgPulse 6s ease-in-out infinite alternate;
        }
        @keyframes bgPulse {
            0% {
                background-size: 100% 100%;
                opacity: 0.9;
            }
            100% {
                background-size: 110% 110%;
                opacity: 1;
            }
        }
        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(74, 124, 247, 0.5);
            border-radius: 4px;
        }
        /* ========== 卡片 ========== */
        .card {
            background: rgba(12, 24, 48, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(74, 124, 247, 0.15);
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            padding: 18px 20px 20px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            border-color: rgba(74, 124, 247, 0.35);
            box-shadow: 0 8px 50px rgba(0, 40, 120, 0.25);
        }
        .card-title {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1.5px;
            color: rgba(160, 190, 235, 0.6);
            text-transform: uppercase;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4a7cf7;
            box-shadow: 0 0 15px rgba(74, 124, 247, 0.8);
            animation: dotPulse 1.8s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
        .card-title .live-badge {
            font-size: 10px;
            background: rgba(255, 70, 70, 0.15);
            color: #ff6b6b;
            padding: 0 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 70, 70, 0.2);
            letter-spacing: 1px;
            animation: livePulse 1.2s ease-in-out infinite;
        }
        @keyframes livePulse {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }
        /* ========== 头部 ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 8px 8px 18px 8px;
            border-bottom: 1px solid rgba(74, 124, 247, 0.10);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-left {
            display: flex;
            align-items: baseline;
            gap: 18px;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #b8d6ff, #4a7cf7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-shadow: 0 0 50px rgba(74, 124, 247, 0.15);
        }
        .header h1 small {
            font-size: 14px;
            font-weight: 400;
            -webkit-text-fill-color: rgba(160, 190, 235, 0.4);
            letter-spacing: 0;
            margin-left: 10px;
        }
        .header-time {
            font-size: 13px;
            color: rgba(160, 190, 235, 0.4);
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-time .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00d4ff;
            box-shadow: 0 0 15px #00d4ff;
            animation: dotPulse 1s ease-in-out infinite;
        }
        /* ========== KPI 网格 ========== */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px;
            margin-bottom: 14px;
        }
        .kpi-card {
            background: rgba(12, 24, 48, 0.70);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(74, 124, 247, 0.12);
            border-radius: 14px;
            padding: 12px 12px 14px;
            text-align: center;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 14px 14px 0 0;
            opacity: 0.8;
        }
        /* 第一行颜色 */
        .kpi-grid .kpi-card:nth-child(1)::before {
            background: linear-gradient(90deg, #00d4ff, #4a7cf7);
        }
        .kpi-grid .kpi-card:nth-child(2)::before {
            background: linear-gradient(90deg, #f0c040, #f5a623);
        }
        .kpi-grid .kpi-card:nth-child(3)::before {
            background: linear-gradient(90deg, #4ecdc4, #44b39d);
        }
        .kpi-grid .kpi-card:nth-child(4)::before {
            background: linear-gradient(90deg, #ff6b6b, #ee5a24);
        }
        .kpi-grid .kpi-card:nth-child(5)::before {
            background: linear-gradient(90deg, #a29bfe, #6c5ce7);
        }
        .kpi-grid .kpi-card:nth-child(6)::before {
            background: linear-gradient(90deg, #fd79a8, #e84393);
        }

        .kpi-card:hover {
            border-color: rgba(74, 124, 247, 0.40);
            transform: translateY(-2px);
        }
        .kpi-label {
            font-size: 11px;
            color: rgba(160, 190, 235, 0.5);
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            white-space: nowrap;
        }
        .kpi-platform {
            font-size: 10px;
            color: rgba(160, 190, 235, 0.2);
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }
        .kpi-values {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .kpi-values .old {
            color: rgba(160, 190, 235, 0.3);
            font-weight: 400;
            font-size: 12px;
            text-decoration: line-through;
            text-decoration-color: rgba(255, 107, 107, 0.2);
        }
        .kpi-values .new {
            color: #fff;
            font-weight: 700;
            font-size: 18px;
            transition: all 0.15s;
        }
        .kpi-values .new.flash {
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }
        .kpi-values .new.flash-down {
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.4);
        }
        .kpi-values .arrow {
            font-size: 12px;
            color: rgba(160, 190, 235, 0.15);
        }
        .kpi-values .unit {
            font-size: 11px;
            color: rgba(160, 190, 235, 0.3);
            font-weight: 400;
            margin-left: 1px;
        }
        .kpi-change {
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 1px 10px;
            border-radius: 20px;
            background: rgba(0, 212, 255, 0.06);
            border: 1px solid rgba(0, 212, 255, 0.08);
            transition: all 0.2s;
        }
        .kpi-change.up {
            color: #00d4ff;
        }
        .kpi-change.down {
            color: #ff6b6b;
        }
        .kpi-change .icon {
            font-size: 12px;
        }
        .kpi-change .change-val {
            font-size: 11px;
        }
        /* ========== 排名图表 (全宽) ========== */
        .rank-section {
            margin-bottom: 18px;
        }
        .rank-section .chart-box {
            height: 300px;
            width: 100%;
        }
        /* ========== 日志区域 ========== */
        .log-section {
            margin-bottom: 18px;
        }
        .log-container {
            height: 160px;
            overflow: hidden;
            position: relative;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            padding: 4px 10px;
            border: 1px solid rgba(74, 124, 247, 0.08);
            display: flex;
            flex-direction: column;
        }
        .log-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 12px;
            flex-shrink: 0;
            transition: background 0.2s;
            animation: logSlideIn 0.35s ease-out;
            line-height: 1.4;
        }
        .log-item:hover {
            background: rgba(74, 124, 247, 0.06);
        }
        @keyframes logSlideIn {
            0% {
                opacity: 0;
                transform: translateY(-20px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .log-item .time {
            color: rgba(160, 190, 235, 0.3);
            font-size: 10px;
            min-width: 55px;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }
        .log-item .user-id {
            color: rgba(200, 215, 240, 0.7);
            font-weight: 500;
            font-size: 11px;
            min-width: 90px;
            flex-shrink: 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
        }
        .log-item .platform-tag {
            display: inline-block;
            padding: 0 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
            min-width: 40px;
            text-align: center;
            flex-shrink: 0;
        }
        .platform-tag.jd {
            color: #e94e4e;
            border-color: rgba(233, 78, 78, 0.3);
            background: rgba(233, 78, 78, 0.08);
        }
        .platform-tag.douyin {
            color: #00d4ff;
            border-color: rgba(0, 212, 255, 0.3);
            background: rgba(0, 212, 255, 0.08);
        }
        .platform-tag.shop {
            color: #a29bfe;
            border-color: rgba(162, 155, 254, 0.3);
            background: rgba(162, 155, 254, 0.08);
        }
        .platform-tag.xiaohongshu {
            color: #fd79a8;
            border-color: rgba(253, 121, 168, 0.3);
            background: rgba(253, 121, 168, 0.08);
        }
        .platform-tag.video {
            color: #4ecdc4;
            border-color: rgba(78, 205, 196, 0.3);
            background: rgba(78, 205, 196, 0.08);
        }
        .log-item .product-title {
            flex: 1;
            color: rgba(200, 215, 240, 0.75);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }
        .log-item .amount {
            color: #f0c040;
            font-weight: 700;
            font-size: 14px;
            margin-left: auto;
            text-shadow: 0 0 20px rgba(240, 192, 64, 0.15);
            letter-spacing: 0.3px;
            flex-shrink: 0;
            padding-left: 8px;
        }
        .log-item .action-text {
            color: rgba(160, 190, 235, 0.3);
            font-size: 11px;
            flex-shrink: 0;
        }
        /* ========== 表格 ========== */
        .table-wrap {
            overflow: auto;
            max-height: 210px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.25);
        }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            color: rgba(200, 215, 240, 0.8);
        }
        .table-wrap thead {
            position: sticky;
            top: 0;
            z-index: 2;
            background: rgba(8, 16, 36, 0.95);
            backdrop-filter: blur(4px);
        }
        .table-wrap th {
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            color: rgba(160, 190, 235, 0.5);
            border-bottom: 1px solid rgba(74, 124, 247, 0.12);
            font-size: 10px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .table-wrap td {
            padding: 7px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .table-wrap tbody tr {
            transition: background 0.2s;
        }
        .table-wrap tbody tr:hover {
            background: rgba(74, 124, 247, 0.05);
        }
        .table-wrap .type-tag {
            display: inline-block;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .type-tag.traditional {
            background: rgba(74, 124, 247, 0.12);
            color: #4a7cf7;
        }
        .type-tag.content {
            background: rgba(0, 212, 255, 0.10);
            color: #00d4ff;
        }
        .type-tag.independent {
            background: rgba(162, 155, 254, 0.12);
            color: #a29bfe;
        }
        .table-wrap .up {
            color: #00d4ff;
            font-weight: 600;
        }
        .table-wrap .down {
            color: #ff6b6b;
            font-weight: 600;
        }
        .table-wrap .highlight {
            color: #f0c040;
            font-weight: 600;
        }
        .table-wrap .val-flash {
            transition: color 0.15s;
        }
        /* ========== 响应式 ========== */
        @media (max-width: 1200px) {
            .kpi-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            body {
                padding: 14px 16px 20px;
            }
        }
        @media (max-width: 768px) {
            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 640px) {
            .kpi-grid {
                grid-template-columns: 1fr 1fr;
            }
            .header h1 {
                font-size: 20px;
            }
            .header h1 small {
                font-size: 12px;
                display: block;
                margin-left: 0;
            }
            .kpi-values .new {
                font-size: 16px;
            }
            .rank-section .chart-box {
                height: 260px;
            }
            .log-container {
                height: 130px;
            }
            .log-item {
                font-size: 11px;
                padding: 3px 6px;
                gap: 4px;
                flex-wrap: wrap;
            }
            .log-item .time {
                min-width: 40px;
                font-size: 9px;
            }
            .log-item .user-id {
                min-width: 70px;
                font-size: 10px;
            }
            .log-item .product-title {
                font-size: 10px;
                flex: 1 1 100%;
                order: 10;
                white-space: normal;
                margin-top: 2px;
            }
            .log-item .amount {
                font-size: 12px;
            }
            .log-item .platform-tag {
                font-size: 9px;
                min-width: 30px;
                padding: 0 5px;
            }
        }
        @media (max-width: 420px) {
            .kpi-grid {
                grid-template-columns: 1fr 1fr;
            }
            body {
                padding: 10px 10px 16px;
            }
            .log-item .user-id {
                min-width: 60px;
            }
        }
        .footer-note {
            text-align: center;
            margin-top: 22px;
            font-size: 11px;
            color: rgba(160, 190, 235, 0.10);
            letter-spacing: 2px;
        }
    </style>

    <!-- ========== 顶部 ========== -->
    <header class="header">
        <div class="header-left">
            <h1>
                ⚡ 实时数据大屏
                <small>国庆活动 · 定向增长（目标上限）</small>

    <div class="card" style="width:100%;">
        <div class="card-title"><span class="dot"></span>📊 优化前 VS 实时优化 VS 行业平均
            <span class="live-badge">● LIVE</span>
            <span class="ind-note" style="margin-left:auto;font-size:10px;color:rgba(160,190,235,0.4);letter-spacing:.5px;">实时优化值逐秒追赶行业基准</span>

    <!-- ========== 实时成交日志 ========== -->
    <section class="log-section">
        <div class="card" style="width:100%;">
            <div class="card-title"><span class="dot"></span>🔥 实时成交动态 <span class="live-badge">● LIVE</span></div>

    <!-- ========== 实时涨幅排名 (全宽) ========== -->
    <section class="rank-section">
        <div class="card">

            <div class="chart-box" id="chartRank"></div>
        </div>
    </section>

    <section>
        <div class="card">

            <div class="table-wrap" id="dataTableWrap"></div>

    <script>
        // ================================================================
        //  1. 基础数据 (基准)
        // ================================================================
        const BASE_DATA = [
            { type: '传统货架电商', platform: '天猫', metric: '主图点击率', old: 0.029, new: 0.034, ref: 0.030 },
            { type: '传统货架电商', platform: '天猫', metric: '转化率', old: 0.023, new: 0.029, ref: 0.025 },
            { type: '传统货架电商', platform: '京东', metric: '主图点击率', old: 0.015, new: 0.025, ref: 0.022 },
            { type: '传统货架电商', platform: '京东', metric: '转化率', old: 0.016, new: 0.028, ref: 0.025 },

            { type: '独立站', platform: '官方商城', metric: '站外进店率', old: 0.16, new: 0.26, ref: 0.23 },
            { type: '独立站', platform: '官方商城', metric: '转化率', old: 0.018, new: 0.026, ref: 0.022 },
        ];
        // ================================================================
        //  2. 全局状态
        // ================================================================
        let currentData = JSON.parse(JSON.stringify(BASE_DATA));
        let chartRankInstance = null;
        let chartCompareInstance = null;
        let updateTimer = null;
        let logTimer = null;
        const logContainer = document.getElementById('logContainer');
        const PLATFORM_CLASS = {
            '京东': 'jd',
            '抖音': 'douyin',
            '官方商城': 'shop',
            '小红书': 'xiaohongshu',
            '视频号': 'video'
        };
        // ================================================================
        //  3. 定义特殊指标（需单向增长且受目标限制）
        // ================================================================
        const SPECIAL_TARGETS = {
            '京东': ['主图点击率', '转化率'],
            '抖音': ['视频完播率', '转化率'],
            '官方商城': ['站外进店率', '转化率']
        };
        let targetMap = {};

        function initTargets() {
            BASE_DATA.forEach(item => {
                const key = item.platform + '|' + item.metric;
                targetMap[key] = item.new;
                const plat = item.platform;
                if (SPECIAL_TARGETS[plat] && SPECIAL_TARGETS[plat].includes(item.metric)) {
                    const ratio = 0.75 + Math.random() * 0.05;
                    const initVal = item.new * ratio;
                    const idx = currentData.findIndex(d => d.platform === plat && d.metric === item.metric);
                    if (idx !== -1) {
                        currentData[idx].new = initVal;
                    }
                }
            });
        }
        // ================================================================
        //  4. 日志生成
        // ================================================================
        function randomUserId() {
            const prefix = Math.floor(Math.random() * 100000000).toString().padStart(8, '0');
            return prefix + '************';
        }

        function randomPlatform() {
            const platforms = ['京东', '抖音', '官方商城', '小红书', '视频号'];
            return platforms[Math.floor(Math.random() * platforms.length)];
        }

        function randomAmount() {
            return Math.round(Math.random() * 220 + 380);
        }

        function randomProductTitle() {
            const PRODUCT_TITLES = [
                "新疆长绒棉×新中式刺绣，新婚四件套，A类母婴级亲肤透气，热湿调节整夜舒爽",
                "国潮刺绣新婚床上四件套，新疆长绒棉加持，A类母婴级，热湿调节+亲肤透气双守护",
                "新中式婚庆四件套，新疆长绒棉底布+立体刺绣，A类母婴级亲肤，热湿调节告别闷汗",
                "新疆长绒棉刺绣四件套，专为新婚定制，国潮新中式风，A类母婴级，亲肤透气且热湿调节",
                "新婚必入：国潮刺绣新中式床上四件套，新疆长绒棉，A类母婴级，亲肤透气与热湿调节兼得",
                "热湿调节黑科技+新疆长绒棉，新中式刺绣新婚四件套，A类母婴级亲肤透气，国潮婚房首选",
                "A类母婴级新疆长绒棉四件套，新中式刺绣婚庆款，亲肤透气会呼吸，热湿调节护新婚好眠",
                "国潮新中式刺绣新婚床上用品四件套，新疆长绒棉织造，A类母婴级，亲肤透气+智能热湿调节",
                "新疆长绒棉×新中式刺绣，国潮新婚床上四件套，A类母婴级亲肤透气，热湿调节双效合一",
                "国潮风新中式刺绣新婚四件套，甄选新疆长绒棉，A类母婴级，亲肤透气且热湿调节同步",
                "热湿调节+亲肤透气，新疆长绒棉新中式刺绣，新婚国潮床上四件套，A类母婴级认证",
                "新婚床上四件套，新疆长绒棉配新中式刺绣，国潮设计，A类母婴级亲肤透气，热湿调节双效协同",
                "新中式国潮刺绣，新疆长绒棉织就新婚四件套，A类母婴级，亲肤透气与热湿调节兼备",
                "A类母婴级新疆长绒棉，新中式刺绣国潮新婚床上四件套，亲肤透气，热湿调节全覆盖",
                "国潮新中式刺绣新婚床上用品，新疆长绒棉四件套，A类母婴级，亲肤透气+热湿调节双驱动",
                "新婚四件套，新疆长绒棉新中式刺绣，国潮风，A类母婴级亲肤透气，热湿调节功能完备",
                "刺绣勾勒国潮新中式，新疆长绒棉新婚床上四件套，A类母婴级，亲肤透气与热湿调节缺一不可",
                "新疆长绒棉新中式刺绣四件套，国潮新婚床上用品，A类母婴级亲肤透气，热湿调节全面覆盖"
            ];
            return PRODUCT_TITLES[Math.floor(Math.random() * PRODUCT_TITLES.length)];
        }

        function currentTimeStr() {
            const now = new Date();
            return now.toTimeString().slice(0, 8);
        }

        function formatCurrency(amount) {
            return '¥' + amount.toFixed(0);
        }

        function initLogs(count = 5) {
            logContainer.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const entry = createLogEntry(true);
                logContainer.appendChild(entry);
            }
        }

        function createLogEntry(noAnimation = false) {
            const userId = randomUserId();
            const platform = randomPlatform();
            const amount = randomAmount();
            const product = randomProductTitle();
            const time = currentTimeStr();
            const div = document.createElement('div');
            div.className = 'log-item';
            if (noAnimation) div.style.animation = 'none';
            const parts = [
                { cls: 'time', text: time },
                { cls: 'user-id', text: userId },
                { cls: 'action-text', text: '在' },
                { cls: `platform-tag ${PLATFORM_CLASS[platform] || ''}`, text: platform },
                { cls: 'action-text', text: '下单' },
                { cls: 'product-title', text: product },
                { cls: 'amount', text: formatCurrency(amount) },
            ];
            parts.forEach(p => {
                const el = document.createElement('span');
                el.className = p.cls;
                el.textContent = p.text;
                div.appendChild(el);
            });
            return div;
        }

        function addLogEntry() {
            const newItem = createLogEntry(false);
            logContainer.prepend(newItem);
            while (logContainer.children.length > 20) {
                logContainer.removeChild(logContainer.lastChild);
            }
            logContainer.scrollTop = 0;
        }
        // ================================================================
        //  5. 数据工具
        // ================================================================
        function pct(v) { return v * 100; }

        function pctStr(v, d = 2) { return (v * 100).toFixed(d) + '%'; }

        function changePp(oldVal, newVal) { return (newVal - oldVal) * 100; }

        function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }
        // ================================================================
        //  6. 核心刷新逻辑：跳失率允许降低，其余全部只增不减
        // ================================================================
        function refreshData() {
            //普通指标区分：视频跳失率允许下降，其他普通指标只允许上涨
            const normalItems = currentData.filter(item => {
                const plat = item.platform;
                return !(SPECIAL_TARGETS[plat] && SPECIAL_TARGETS[plat].includes(item.metric));
            });

            const newNormal = normalItems.map(item => {
                //视频跳失率：允许下降，小幅波动
                if (item.metric === "视频跳失率") {
                    let delta = (Math.random() * 0.0045) * (Math.random() > 0.5 ? -1 : 1);
                    let newVal = clamp(item.new + delta, 0.3, 0.65);
                    return { ...item, new: newVal };
                } else {
                    //其余普通指标：只增不减，小幅增长
                    const growth = 0.001 + Math.random() * 0.006;
                    let newVal = item.new * (1 + growth);
                    return { ...item, new: newVal };
                }
            });

            //特殊指标：只增不减，不超过目标，增长幅度缩小
            const specialItems = currentData.filter(item => {
                const plat = item.platform;
                return SPECIAL_TARGETS[plat] && SPECIAL_TARGETS[plat].includes(item.metric);
            });
            const newSpecial = specialItems.map(item => {
                const key = item.platform + '|' + item.metric;
                const target = targetMap[key];
                let current = item.new;
                const growth = 0.002 + Math.random() * 0.008;
                let increment = current * growth;
                if (item.metric === '转化率' || item.metric === '主图点击率' || item.metric === '站外进店率') {
                    increment = Math.max(increment, 0.00005);
                }
                if (item.metric === '视频完播率') {
                    increment = Math.max(increment, 0.0005);
                }
                let newVal = current + increment;
                if (newVal > target) newVal = target;
                if (current >= target * 0.995) newVal = target;
                return { ...item, new: newVal };
            });

            const merged = [...newNormal, ...newSpecial];
            const order = BASE_DATA.map(d => d.platform + '|' + d.metric);
            merged.sort((a, b) => {
                return order.indexOf(a.platform + '|' + a.metric) - order.indexOf(b.platform + '|' + b.metric);
            });
            currentData = merged;
        }
        // ================================================================
        //  7. 渲染 KPI
        // ================================================================
        const KPI_MAP = [
            { label: '视频完播率', platform: '抖音', metric: '视频完播率' },
            { label: '转化率', platform: '抖音', metric: '转化率' },
            { label: '主图点击率', platform: '京东', metric: '主图点击率' },
            { label: '成交转化率', platform: '京东', metric: '转化率' },
            { label: '站外进店率', platform: '官方商城', metric: '站外进店率' },
            { label: '转化率', platform: '官方商城', metric: '转化率' },
        ];

        function renderCompareChart(data) {
            const dom = document.getElementById('chartCompare');
            if (!dom) return;
            if (!chartCompareInstance) chartCompareInstance = echarts.init(dom);
            const rows = KPI_MAP.map(k => {
                const item = data.find(d => d.platform === k.platform && d.metric === k.metric);
                return {
                    name: k.platform + '·' + k.label,
                    before: item ? +((item.old * 100).toFixed(2)) : 0,
                    current: item ? +((item.new * 100).toFixed(2)) : 0,
                    ref: item ? +((item.ref * 100).toFixed(2)) : 0,
                    beforeS: item ? (item.old * 100).toFixed(2) + '%' : '-',
                    curS: item ? (item.new * 100).toFixed(2) + '%' : '-',
                    refS: item ? (item.ref * 100).toFixed(2) + '%' : '-'
                };
            });
            const names = rows.map(r => r.name);
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' },
                    formatter: function(ps) {
                        const i = ps[0].dataIndex; const r = rows[i];
                        const gapC = (r.current - r.before).toFixed(2);
                        const gapRef = (r.current - r.ref).toFixed(2);
                        return '<strong>' + r.name + '</strong><br/>' +
                            '优化前：' + r.beforeS + '<br/>' +
                            '实时优化：<span style="color:#00d4ff">' + r.curS + '</span> (' +
                            (gapC >= 0 ? '+' : '') + gapC + 'pp)<br/>' +
                            '行业平均：<span style="color:#f0c040">' + r.refS + '</span> (差' +
                            (gapRef >= 0 ? '+' : '') + gapRef + 'pp)';
                    }
                },
                legend: {
                    data: ['优化前', '实时优化', '行业平均'], top: 0,
                    textStyle: { color: 'rgba(200,215,240,0.75)', fontSize: 12 },
                    itemWidth: 14, itemHeight: 8
                },
                grid: { left: 135, right: 90, top: 48, bottom: 20 },
                xAxis: {
                    type: 'value', name: '%',
                    nameTextStyle: { color: 'rgba(160,190,235,0.35)', fontSize: 11 },
                    axisLabel: { color: 'rgba(160,190,235,0.4)', fontSize: 11, formatter: '{value}%' },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)', type: 'dashed' } },
                    axisLine: { show: false }
                },
                yAxis: {
                    type: 'category', data: names,
                    axisLabel: { color: 'rgba(200,215,240,0.7)', fontSize: 12 },
                    axisLine: { show: false }, axisTick: { show: false }
                },
                series: [
                    {
                        name: '优化前', type: 'bar', data: rows.map(r => r.before), barWidth: 12,
                        itemStyle: { color: 'rgba(160,190,235,0.32)', borderRadius: [0, 3, 3, 0] },
                        label: { show: true, position: 'right', color: 'rgba(160,190,235,0.5)', fontSize: 10, formatter: '{c}%' }
                    },
                    {
                        name: '实时优化', type: 'bar', data: rows.map(r => r.current), barWidth: 12,
                        itemStyle: {
                            borderRadius: [0, 3, 3, 0],
                            color: new echarts.graphic.LinearGradient(0, 0, 1, 0,
                                [{ offset: 0, color: '#00d4ff' }, { offset: 1, color: '#4a7cf7' }])
                        },
                        label: { show: true, position: 'right', color: '#00d4ff', fontSize: 11, formatter: '{c}%' }
                    },
                    {
                        name: '行业平均', type: 'bar', data: rows.map(r => r.ref), barWidth: 12,
                        itemStyle: { color: 'rgba(240,192,64,0.82)', borderRadius: [0, 3, 3, 0] },
                        label: { show: true, position: 'right', color: '#f0c040', fontSize: 10, formatter: '{c}%' }
                    }
                ],
                animationDuration: 500,
                animationDurationUpdate: 700,
                backgroundColor: 'transparent'
            };
            chartCompareInstance.setOption(option, true);
        }

        function renderKPI(data) {
            const grid = document.getElementById('kpiGrid');
            const cards = KPI_MAP.map(kpi => {
                const item = data.find(d => d.platform === kpi.platform && d.metric === kpi.metric);
                if (!item) return '';
                const oldStr = pctStr(item.old);
                const newStr = pctStr(item.new);
                const pp = changePp(item.old, item.new);
                const isUp = pp >= 0;
                const arrow = isUp ? '↑' : '↓';
                const sign = isUp ? '+' : '';
                const cls = isUp ? 'up' : 'down';
                const flashType = Math.random() > 0.7 ? (isUp ? 'flash' : 'flash-down') : '';
                return `
                    <div class="kpi-card">
                        <div class="kpi-label">${kpi.label}</div>
                        <div class="kpi-platform">${item.platform}</div>
                        <div class="kpi-values">
                            <span class="old">${oldStr}</span>
                            <span class="arrow">→</span>
                            <span class="new ${flashType}">${newStr}</span>
                        </div>
                        <div class="kpi-change ${cls}">
                            <span class="icon">${arrow}</span>
                            ${sign}${pp.toFixed(2)} pp
                        </div>
                    </div>
                `;
            }).join('');
            grid.innerHTML = cards;
        }

        // ================================================================
        //  8. 渲染排名图表
        // ================================================================
        function renderRankChart(data) {
            const dom = document.getElementById('chartRank');
            if (!chartRankInstance) {
                chartRankInstance = echarts.init(dom);
            }
            const ranked = data.map(d => ({
                ...d,
                pp: changePp(d.old, d.new),
                label: `${d.platform}·${d.metric}`,
            }));
            ranked.sort((a, b) => b.pp - a.pp);
            const names = ranked.map(d => d.label);
            const values = ranked.map(d => d.pp);
            const colors = ranked.map(d => d.pp >= 0 ? '#00d4ff' : '#ff6b6b');
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' },
                    formatter: function(params) {
                        const p = params[0];
                        const idx = p.dataIndex;
                        const d = ranked[idx];
                        const oldP = pctStr(d.old);
                        const newP = pctStr(d.new);
                        return `
                            <strong>${d.platform} · ${d.metric}</strong><br />
                            同期：${oldP} &nbsp;→&nbsp; 优化：${newP}<br />
                            <span style="color:${d.pp>=0?'#00d4ff':'#ff6b6b'}">
                                ${d.pp >= 0 ? '增长' : '降低'}：${d.pp.toFixed(2)} pp
                            </span>
                        `;
                    }
                },
                grid: { left: 110, right: 40, bottom: 12, top: 12 },
                xAxis: {
                    type: 'value',
                    name: '变化 (pp)',
                    nameTextStyle: { color: 'rgba(160,190,235,0.2)', fontSize: 11 },
                    axisLabel: {
                        color: 'rgba(160,190,235,0.3)',
                        fontSize: 11,
                        formatter: '{value} pp',
                    },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.04)', type: 'dashed' } },
                    axisLine: { show: false },
                },
                yAxis: {
                    type: 'category',
                    data: names,
                    axisLabel: {
                        color: 'rgba(160,190,235,0.5)',
                        fontSize: 11,
                    },
                    axisLine: { show: false },
                    axisTick: { show: false },
                },
                series: [{
                    type: 'bar',
                    data: values.map((v, i) => ({
                        value: v,
                        itemStyle: {
                            color: colors[i],
                            borderRadius: [0, 4, 4, 0],
                            shadowColor: v >= 0 ? 'rgba(0,212,255,0.15)' : 'rgba(255,107,107,0.10)',
                            shadowBlur: 6,
                        }
                    })),
                    barWidth: 16,
                    label: {
                        show: true,
                        position: 'right',
                        color: 'rgba(160,190,235,0.4)',
                        fontSize: 10,
                        formatter: function(params) {
                            return params.value >= 0 ? '+' + params.value.toFixed(2) + 'pp' : params.value.toFixed(2) +
                                'pp';
                        }
                    },
                }],
                animationDuration: 600,
                backgroundColor: 'transparent',
            };
            chartRankInstance.setOption(option, true);
        }
        // ================================================================
        //  9. 渲染表格
        // ================================================================
        function renderTable(data) {
            const wrap = document.getElementById('dataTableWrap');
            const sorted = [...data];
            const typeOrder = { '传统货架电商': 1, '内容电商': 2, '独立站': 3 };
            sorted.sort((a, b) => (typeOrder[a.type] || 9) - (typeOrder[b.type] || 9));
            let html = `<table>
                <thead><tr>
                    <th>类型</th><th>平台</th><th>核心指标</th>
                    <th>同期</th><th>实时优化</th><th>变化 (pp)</th><th>行业参考</th>
                </tr></thead><tbody>`;
            sorted.forEach(d => {
                const pp = changePp(d.old, d.new);
                const isUp = pp >= 0;
                const cls = isUp ? 'up' : 'down';
                const sign = isUp ? '+' : '';
                const typeClass = {
                    '传统货架电商': 'traditional',
                    '内容电商': 'content',
                    '独立站': 'independent'
                } [d.type] || '';
                const flashClass = Math.random() > 0.8 ? 'val-flash' : '';
                html += `
                    <tr>
                        <td><span class="type-tag ${typeClass}">${d.type}</span></td>
                        <td>${d.platform}</td>
                        <td>${d.metric}</td>
                        <td>${pctStr(d.old)}</td>
                        <td class="highlight ${flashClass}">${pctStr(d.new)}</td>
                        <td class="${cls}">${sign}${pp.toFixed(2)}</td>
                        <td style="color:rgba(160,190,235,0.25);font-size:11px;">${pctStr(d.ref)}</td>
                    </tr>
                `;
            });
            html += `</tbody></table>`;
            wrap.innerHTML = html;
        }
        // ================================================================
        //  10. 整体刷新
        // ================================================================
        function refreshAll() {
            refreshData();
            const now = new Date();
            const ts = now.toISOString().replace('T', ' ').slice(0, 19);
            document.getElementById('liveTimestamp').textContent = ts;
            renderKPI(currentData);
            renderRankChart(currentData);
            renderCompareChart(currentData);
            renderTable(currentData);
        }
        // ================================================================
        //  11. 启动
        // ================================================================
        function init() {
            initTargets();
            initLogs(5);
            refreshAll();
            if (updateTimer) clearInterval(updateTimer);
            updateTimer = setInterval(refreshAll, 1500);
            if (logTimer) clearInterval(logTimer);
            logTimer = setInterval(addLogEntry, 1200);
            window.addEventListener('resize', () => {
                if (chartRankInstance) chartRankInstance.resize();
                if (chartCompareInstance) chartCompareInstance.resize();
            });
        }
        window.addEventListener('load', init);
    </script>
