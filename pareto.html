<div id="main"></div>



<script>


var chart = echarts.init(document.getElementById("main"));



// 年龄群体

var age=[

"18-31岁\nZ世代",

"32-41岁",

"42-51岁",

"≥52岁",

"≤17岁"

];



// 家纺产品消费贡献占比

var contribution=[

40,

30,

15,

10,

5

];



// 累计贡献占比

var cumulative=[

40,

70,

85,

95,

100

];



var option={


backgroundColor:"#061525",



title:{


text:"帕累托模型",


left:"center",


top:25,


textStyle:{


color:"#00eaff",


fontSize:32,


fontWeight:"bold"


}


},



tooltip:{


trigger:"axis"


},



legend:{


top:80,


textStyle:{


color:"#ffffff"


},


data:[

"家纺类产品消费贡献占比",

"累计贡献占比"

]


},



grid:{


left:"8%",


right:"10%",


bottom:"15%",


top:"20%"


},



xAxis:{


type:"category",


data:age,


axisLabel:{


color:"#ffffff",


fontSize:14


}



},



yAxis:[


{


type:"value",


name:"消费贡献占比 (%)",


axisLabel:{


color:"#ffffff"


},


splitLine:{


lineStyle:{


color:"#24405c"


}


}



},



{


type:"value",


name:"累计贡献占比 (%)",


max:100,


axisLabel:{


color:"#ffffff"


},


splitLine:{


show:false


}



}


],



series:[



{


name:"家纺类产品消费贡献占比",


type:"bar",


barWidth:50,


data:contribution,


label:{


show:true,


position:"top",


color:"#ffffff",


formatter:"{c}%"



},


itemStyle:{


color:"#00eaff"


}



},




{


name:"累计贡献占比",


type:"line",


yAxisIndex:1,


smooth:true,


data:cumulative,


symbol:"circle",


symbolSize:10,


label:{

formatter:"{c}%"



},


lineStyle:{

}



},




{

yAxisIndex:1,

symbol:"none",


lineStyle:{


type:"dashed",


width:2,


color:"#ff4d4f"


},


label:{


show:false


}



}



]


};



chart.setOption(option);



window.onresize=function(){


chart.resize();


}
